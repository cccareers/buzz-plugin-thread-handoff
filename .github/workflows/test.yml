name: Plugin validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # Keep this version aligned with @playwright/test in package.json.
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Align container home ownership for Firefox
        # GitHub mounts a pwuser-owned home, but the container runs as root.
        run: chown "$(id -u):$(id -g)" "$HOME"
      - run: npm test
      - name: Check committed installer bundle
        run: git diff --exit-code -- plugin.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
